name: Daily pendulum

# Posts a fresh randomized chain-pendulum-network animation to the
# Telegram channel once per day.

on:
  schedule:
    # 13:50 UTC daily.  GitHub cron is best-effort: a run may be
    # delayed by several minutes during peak hours, occasionally more.
    - cron: "50 13 * * *"
  # Allow manual triggering from the Actions tab — handy for testing.
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    # Up to 40 min of integration, plus rendering and bounded upload retries.
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check Telegram configuration
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHANNEL" ]; then
            echo "::error::Set both TG_TOKEN and TG_CHANNEL repository secrets"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Generate and post
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: |
          # Size-filtered configurations do not spend an integration attempt.
          # Keep the same scene limits, tolerances, frames and resolution.
          python generate_pendulum_simulation.py \
              -V \
              --max-attempts 10 \
              --attempt-timeout 240 \
              --t-max 16 \
              --max-links 280 \
              --method DOP853 \
              -o animation.mp4

      # Upload the produced animation as a workflow artifact so we can
      # download and inspect it later (helpful when something looks off
      # in the channel).  Artifacts expire after 7 days.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pendulum-${{ github.run_id }}
          path: animation.*
          if-no-files-found: ignore
          retention-days: 7
